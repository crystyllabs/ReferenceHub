<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReferenceHub</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="profile">
      <p class="eyebrow">Professional Reputation Profile</p>
      <h1>Crystyl Swanson</h1>

      <p class="bio">
        Commercial and go-to-market strategist focused on building scalable
        product, sales, partnership, and customer growth systems.
      </p>
    </section>

    <section class="rating-section">
      <p class="label">Overall Professional Rating</p>

      <div class="rating-row">
        <span id="average-rating">Loading...</span>
        <span>/ 5</span>
      </div>

      <p id="review-count">Loading reviews...</p>
    </section>

    <section>
      <h2>Professional Reviews</h2>

      <p id="status-message">Loading reviews...</p>

      <div id="reviews-container"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
